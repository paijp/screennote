name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          # versionCode must increase monotonically for Android to accept an upgrade.
          # major.minor.patch -> major*10000 + minor*100 + patch (each component < 100).
          CORE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          if [ "$CODE" -le 0 ]; then
            echo "::error::Could not derive a versionCode from '$VERSION'; expected major.minor.patch"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Releases must be signed with a stable key,"
            echo "::error::otherwise the in-app updater cannot install over the previous version."
            echo "::error::See docs/RELEASING.md for how to create the key and the secrets."
            exit 1
          fi
          # A PKCS12 keystore cannot hold a per-key password, so for the keystore created by
          # docs/RELEASING.md the key password is the store password. KEY_PASSWORD only needs
          # to be set for a JKS keystore where the two genuinely differ.
          : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PgithubRepo=${{ github.repository }} \
            -PreleaseBranch=${{ github.event.repository.default_branch }}

      - name: Stage APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          DEST="screennote-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "$TAG" \
              --generate-notes
          fi

      # The app updates itself from release/ on the default branch rather than from the
      # Releases API: it needs no API token, is not rate limited per IP, and the manifest can
      # carry a checksum. Releases above remain the per-version archive.
      - name: Publish APK to release/ on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SHA=$(sha256sum "${{ steps.apk.outputs.path }}" | cut -d' ' -f1)
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p release
          cp "${{ steps.apk.outputs.path }}" release/screennote-release.apk
          cat > release/latest.json <<EOF
          {
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "apk": "screennote-release.apk",
            "sha256": "$SHA",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          # Nothing to do when an identical APK was already published.
          git diff --cached --quiet && exit 0
          git commit -m "Publish ${{ steps.version.outputs.name }} to release/"
          git push origin "$BRANCH"
